name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      # Non bloquant pour l'instant : ~740 erreurs de formatage Prettier
      # préexistantes. Retirer `continue-on-error` après `npm run format`.
      - name: Lint
        run: npm run lint
        continue-on-error: true
